# IMPORTANT: This is a sanitized private-preview build.
# ============================================================
# WAVESHARE MATRIX
# ESPHome 2026.9.0
# Waveshare ESP32-S3 RGB Matrix Driver Board
# HUB75 128x64
#
# Public preview based on V12.6.37
# F1TV/Viaplay sync + 10-minute post-session timing hold
#
# Display:
# F1 Race Control
# ============================================================

substitutions:
  device_name: f1-race-control-matrix
  friendly_name: F1 Race Control Matrix

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# External PSRAM on the ESP32-S3-N32R16.
psram:
  mode: octal
  speed: 80MHz

logger:

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:


# ============================================================
# TIJD
# ============================================================

time:
  - platform: homeassistant
    id: ha_time


# ============================================================
# ACTIEVE PAGINA
#
# Public distribution: Race Control is the primary page.
# 2 = F1 Race Control
# ============================================================

globals:
  - id: active_page
    type: int
    restore_value: no
    initial_value: '2'


  - id: flag_animation
    type: int
    restore_value: no
    initial_value: '0'

  - id: flag_animation_frame
    type: int
    restore_value: no
    initial_value: '0'

  # Eliminatiescherm: 0=uit, 1=Q1, 2=Q2, 3=SQ1, 4=SQ2.
  - id: f1_elimination_screen
    type: int
    restore_value: no
    initial_value: '0'

  - id: f1_elimination_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: f1_previous_session_part
    type: int
    restore_value: no
    initial_value: '0'


  # ==========================================================
  # F1 RACE CONTROL DATA
  # De F1TV-vertraging wordt centraal geregeld door Home Assistant:
  # number.f1_live_delay (0-300 s).
  # ESPHome voegt zelf GEEN extra vaste vertraging meer toe.
  # ==========================================================

  - id: f1_delay_current_session
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  # Laat de laatst bekende sessie nog 10 minuten staan wanneer de integratie
  # direct na de vlag current_session wist. Zo blijven laatste vliegende
  # rondes bij Practice/Qualifying zichtbaar.
  - id: f1_last_known_session
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: f1_last_known_session_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Expliciete naloop na het einde van een F1-sessie.
  # Na P1/P2/P3, Q3/SQ3, Sprint en Race blijft F1 TIMING
  # nog exact 10 minuten zichtbaar voordat STANDBY mag verschijnen.
  - id: f1_session_finish_hold_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: f1_delay_session_status
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_track_status
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top1
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top2
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top3
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top1_laptime
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top2_laptime
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top3_laptime
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top1_team_color
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top2_team_color
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_top3_team_color
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_delay_time_remaining
    type: std::string
    restore_value: no
    initial_value: '"unavailable"'

  - id: f1_countdown_seconds
    type: int
    restore_value: no
    initial_value: '-1'

  - id: f1_countdown_sync_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: f1_zero_chequered_shown
    type: bool
    restore_value: no
    initial_value: 'false'

  # Alleen een echte LIVE countdown die boven nul is geweest mag
  # later bij 00:00 een chequered animatie starten.
  - id: f1_zero_chequered_armed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: f1_chequered_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: f1_delay_session_part
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: f1_delay_race_lap
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: f1_delay_total_laps
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: f1_track_status_initialized
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: f1_green_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'



# ============================================================
# POWER
# ============================================================




# ============================================================
# WAVESHARE AUDIO - ES7210 MICROPHONE TEST
#
# Waveshare ESP32-S3-RGB-Matrix (SKU 34422)
# I2C:
#   SDA      = GPIO47
#   SCL      = GPIO48
# I2S:
#   BCLK     = GPIO43
#   LRCLK    = GPIO38
#   MCLK     = GPIO12
#   DIN      = GPIO39
# ES7210 address = 0x40
#
# Speaker/ES8311 output is intentionally not configured.
# ============================================================


switch:
  - platform: template
    name: "Power"
    id: matrix_power
    icon: mdi:power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    turn_on_action:
      - hub75.set_brightness:
          id: matrix_display
          brightness: !lambda |-
            float percent = id(matrix_brightness).state;

            if (isnan(percent)) {
              percent = 50.0;
            }

            return (uint8_t) round(
              (percent / 100.0) * 255.0
            );

    turn_off_action:
      - hub75.set_brightness:
          id: matrix_display
          brightness: 0


# ============================================================
# BRIGHTNESS
# ============================================================

number:
  - platform: template
    name: "Brightness"
    id: matrix_brightness
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    optimistic: true
    mode: slider

    on_value:
      then:
        - if:
            condition:
              switch.is_on: matrix_power
            then:
              - hub75.set_brightness:
                  id: matrix_display
                  brightness: !lambda |-
                    return (uint8_t) round(
                      (x / 100.0) * 255.0
                    );

  # Interne directe koppeling met de F1 Sensor-integratie.
  # Deze entity wordt niet als extra bediening in Home Assistant getoond.
  - platform: homeassistant
    id: f1_live_delay_source
    entity_id: number.f1_live_delay
    internal: true

    on_value:
      then:
        - lambda: |-
            if (!isnan(x) && fabsf(id(f1tv_synchronisatie).state - x) >= 0.5f) {
              id(f1tv_synchronisatie).publish_state(x);
            }

  # Zichtbare bediening op de Waveshare/ESPHome-devicepagina.
  # number.set stuurt rechtstreeks naar bovenstaande Home Assistant-number.
  - platform: template
    name: "F1TV/Viaplay Sync"
    id: f1tv_synchronisatie
    icon: mdi:speedometer
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 1
    mode: slider
    optimistic: true
    restore_value: false
    initial_value: 0

    set_action:
      - number.set:
          id: f1_live_delay_source
          value: !lambda 'return x;'


# ============================================================
# F1 RACE CONTROL - CENTRALE DELAY
#
# Geen lokale 41s-buffer meer. number.f1_live_delay van de F1 Sensor
# integratie vertraagt de brondata centraal, zodat timing, rondes,
# vlaggen en sessiestatus dezelfde instelbare delay gebruiken.
# ============================================================

script:
  - id: delay_f1_current_session
    mode: queued
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_current_session) = value;

          bool known =
            value == "Practice 1" ||
            value == "Practice 2" ||
            value == "Practice 3" ||
            value == "Qualifying" ||
            value == "Sprint Qualifying" ||
            value == "Sprint" ||
            value == "Race";

          if (known) {
            id(f1_last_known_session) = value;
            id(f1_last_known_session_until) = millis() + 600000UL;
          }

          bool timed =
            value == "Qualifying" ||
            value == "Sprint Qualifying";

          if (!timed) {
            id(f1_zero_chequered_armed) = false;
            id(f1_zero_chequered_shown) = false;
          }

  - id: delay_f1_session_status
    mode: queued
    parameters:
      value: string
    then:
      - lambda: |-
          // Een oude finishstatus mag niet alsnog afgaan
          // wanneer Home Assistant inmiddels alweer naar een nieuwe fase is gegaan.
          bool is_finish =
            value == "finished" || value == "finalised" || value == "ended";

          if (is_finish) {
            std::string live_status = id(ha_f1_session_status).state;
            for (auto &c : live_status) {
              c = tolower(static_cast<unsigned char>(c));
            }

            bool live_still_finished =
              live_status == "finished" ||
              live_status == "finalised" ||
              live_status == "ended";

            if (!live_still_finished) {
              return;
            }
          }

          std::string delayed_session = id(f1_delay_current_session);
          if (
            delayed_session != "Practice 1" &&
            delayed_session != "Practice 2" &&
            delayed_session != "Practice 3" &&
            delayed_session != "Qualifying" &&
            delayed_session != "Sprint Qualifying" &&
            delayed_session != "Sprint" &&
            delayed_session != "Race"
          ) {
            delayed_session = id(f1_last_known_session);
          }

          bool timed_session =
            delayed_session == "Qualifying" ||
            delayed_session == "Sprint Qualifying";

          // Bij Qualifying/Sprint Qualifying bepaalt de zichtbare 00:00 de
          // finishvlag. Een finished-status tijdens Q1/Q2 mag dus niet als
          // einde van de hele sessie worden behandeld. Alleen Q3/SQ3 krijgt
          // de algemene 10-minuten-naloop.
          if (is_finish && timed_session) {
            int part = isnan(id(f1_delay_session_part))
              ? 0
              : (int) lroundf(id(f1_delay_session_part));

            if (part >= 3) {
              id(f1_last_known_session) = delayed_session;
              id(f1_session_finish_hold_until) = millis() + 600000UL;
              id(f1_last_known_session_until) = id(f1_session_finish_hold_until);
            }
            return;
          }

          std::string previous_status = id(f1_delay_session_status);
          for (auto &c : previous_status) {
            c = tolower(static_cast<unsigned char>(c));
          }

          id(f1_delay_session_status) = value;

          // Race/Sprint: alleen een echte overgang vanuit LIVE mag de
          // chequered animatie starten. Een oude FINISHED-status bij
          // reconnect, refresh of pre-session data wordt zo genegeerd.
          if (is_finish && previous_status == "live") {
            id(flag_animation) = 6;
            id(flag_animation_frame) = 0;
            id(f1_chequered_started_ms) = millis();

            // P1/P2/P3, Sprint en Race: vanaf de vertraagde officiële
            // finish nog 10 minuten F1 TIMING vasthouden.
            if (!delayed_session.empty()) {
              id(f1_last_known_session) = delayed_session;
            }
            id(f1_session_finish_hold_until) = millis() + 600000UL;
            id(f1_last_known_session_until) = id(f1_session_finish_hold_until);
          }
      - if:
          condition:
            lambda: |-
              return id(flag_animation) == 6;
          then:
            - delay: 10s
            - lambda: |-
                if (id(flag_animation) == 6) {
                  id(flag_animation) = 0;
                }

  - id: delay_f1_track_status
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          std::string previous = id(f1_delay_track_status);
          bool had_previous = id(f1_track_status_initialized);

          id(f1_delay_track_status) = value;
          id(f1_track_status_initialized) = true;

          int animation = 0;

          if (value == "YELLOW") {
            animation = 1;
            id(f1_green_until_ms) = 0;
          } else if (value == "RED") {
            animation = 3;
            id(f1_green_until_ms) = 0;
          } else if (value == "VSC") {
            animation = 4;
            id(f1_green_until_ms) = 0;
          } else if (value == "SC") {
            animation = 5;
            id(f1_green_until_ms) = 0;
          } else if (value == "CLEAR") {
            if (had_previous && previous != "CLEAR" && !previous.empty()) {
              animation = 2;
              id(f1_green_until_ms) = millis() + 60000UL;
            }
          }

          if (animation != 0) {
            id(flag_animation) = animation;
            id(flag_animation_frame) = 0;
          }
      - if:
          condition:
            lambda: |-
              return id(flag_animation) >= 1 && id(flag_animation) <= 5;
          then:
            - delay: 10s
            - lambda: |-
                if (id(flag_animation) >= 1 && id(flag_animation) <= 5) {
                  id(flag_animation) = 0;
                }

  - id: delay_f1_top1
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top1) = value;

  - id: delay_f1_top2
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top2) = value;

  - id: delay_f1_top3
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top3) = value;

  - id: delay_f1_top1_laptime
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top1_laptime) = value;

  - id: delay_f1_top2_laptime
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top2_laptime) = value;

  - id: delay_f1_top3_laptime
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top3_laptime) = value;

  - id: delay_f1_top1_team_color
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top1_team_color) = value;

  - id: delay_f1_top2_team_color
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top2_team_color) = value;

  - id: delay_f1_top3_team_color
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_top3_team_color) = value;

  - id: delay_f1_time_remaining
    mode: restart
    parameters:
      value: string
    then:
      - lambda: |-
          id(f1_delay_time_remaining) = value;

          int total_seconds = -1;
          int a = 0;
          int b = 0;
          int c = 0;

          if (sscanf(value.c_str(), "%d:%d:%d", &a, &b, &c) == 3) {
            total_seconds = (a * 3600) + (b * 60) + c;
          } else if (sscanf(value.c_str(), "%d:%d", &a, &b) == 2) {
            total_seconds = (a * 60) + b;
          }

          if (total_seconds >= 0) {
            // De F1 Sensor integratie levert deze waarde al met de ingestelde
            // number.f1_live_delay. ESPHome telt daarom niets extra op.
            id(f1_countdown_seconds) = total_seconds;
            id(f1_countdown_sync_ms) = millis();

            if (total_seconds > 0) {
              id(f1_zero_chequered_shown) = false;

              std::string session = id(f1_delay_current_session);
              std::string status = id(f1_delay_session_status);
              for (auto &c : status) {
                c = tolower(static_cast<unsigned char>(c));
              }

              bool timed =
                session == "Qualifying" ||
                session == "Sprint Qualifying";

              if (timed && status == "live") {
                id(f1_zero_chequered_armed) = true;
              }
            }
          } else {
            id(f1_countdown_seconds) = -1;
            id(f1_countdown_sync_ms) = 0;
          }

  - id: delay_f1_session_part
    mode: restart
    parameters:
      value: float
    then:
      - lambda: |-
          int new_part = isnan(value) ? 0 : (int) lroundf(value);
          int old_part = id(f1_previous_session_part);
          std::string session = id(f1_delay_current_session);

          id(f1_delay_session_part) = value;

          // Toon de afvallers precies bij de overgang naar de volgende kwalificatiedeel.
          // De zes namen komen uit compacte HA-template-sensoren.
          if (old_part == 1 && new_part == 2) {
            if (session == "Qualifying") {
              id(f1_elimination_screen) = 1;
              id(f1_elimination_until_ms) = millis() + 10000UL;
            } else if (session == "Sprint Qualifying") {
              id(f1_elimination_screen) = 3;
              id(f1_elimination_until_ms) = millis() + 10000UL;
            }
          } else if (old_part == 2 && new_part == 3) {
            if (session == "Qualifying") {
              id(f1_elimination_screen) = 2;
              id(f1_elimination_until_ms) = millis() + 10000UL;
            } else if (session == "Sprint Qualifying") {
              id(f1_elimination_screen) = 4;
              id(f1_elimination_until_ms) = millis() + 10000UL;
            }
          }

          if (new_part >= 1 && new_part <= 3) {
            id(f1_previous_session_part) = new_part;
          }

  - id: delay_f1_race_lap
    mode: queued
    parameters:
      value: float
    then:
      - lambda: |-
          id(f1_delay_race_lap) = value;

  - id: delay_f1_total_laps
    mode: queued
    parameters:
      value: float
    then:
      - lambda: |-
          id(f1_delay_total_laps) = value;

# ============================================================
# HOME ASSISTANT TEKSTSENSOREN
# ============================================================

text_sensor:


  - platform: homeassistant
    id: ha_f1_current_session
    entity_id: sensor.f1_current_session
    internal: true
    on_value:
      then:
        - script.execute:
            id: delay_f1_current_session
            value: !lambda 'return x;'

  - platform: homeassistant
    id: ha_f1_session_status
    entity_id: sensor.f1_session_status
    internal: true
    on_value:
      then:
        - script.execute:
            id: delay_f1_session_status
            value: !lambda 'return x;'










